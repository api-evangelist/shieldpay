name: Shieldpay
description: >-
  Shieldpay is an FCA-authorised (firm reference 770210) payments platform built
  for the UK legal and professional-services sector, offering a regulated
  alternative to holding client money in traditional client accounts. It combines
  KYC/due-diligence verification of parties, safeguarding of funds with tier-1
  banking partners (Citi and ClearBank), and audited disbursement of payments,
  supporting M&A holdbacks/earnouts and shareholder distributions, multi-claimant
  litigation settlements, escrow, conveyancing, and ongoing client-money
  management via its Third-Party Managed Account (TPMA) service. Shieldpay has
  processed over £18 billion and serves 40+ of the UK top-100 law firms. Its
  Partner API lets integrators programmatically create projects, manage payers
  and payees, run KYC, and authorise payments; the API secures every request with
  mutual TLS, an API key, an RSA-SHA256 request signature, a v4-UUID RequestID for
  idempotency, and IP whitelisting, and delivers real-time events over webhooks.
